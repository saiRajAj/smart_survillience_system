<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeVision</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div><h1>SafeVision</h1><p>AI Computer Vision Safety Monitoring</p></div><b>LIVE</b></header><main>{% if startup_error %}<div class="error">{{startup_error}}</div>{% endif %}<section class="grid"><div>People<strong id="people">0</strong></div><div>Risk<strong id="risk">0</strong></div><div>Severity<strong id="severity">LOW</strong></div><div>FPS<strong id="fps">0</strong></div></section><section class="card"><h2>Live Camera</h2><img src="/video_feed"></section><section class="card"><h2>Recent Incidents</h2><table><thead><tr><th>ID</th><th>Time</th><th>Event</th><th>Score</th><th>Severity</th></tr></thead><tbody id="incidents"></tbody></table></section></main><script>async function refresh(){const d=await(await fetch('/api/status')).json();if(d.error)return;document.getElementById('people').textContent=d.people;document.getElementById('risk').textContent=d.risk;document.getElementById('severity').textContent=d.severity;document.getElementById('fps').textContent=d.fps;document.getElementById('incidents').innerHTML=(d.recent_incidents||[]).map(x=>`<tr><td>${x.incident_id}</td><td>${x.timestamp}</td><td>${x.event_type}</td><td>${x.risk_score}</td><td>${x.severity}</td></tr>`).join('')}setInterval(refresh,1000);refresh();</script></body></html>
